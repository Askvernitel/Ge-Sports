<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
body{margin:0;}
::selection{background:#3E7CA3;color:#171310;}
a{color:#3E7CA3;}
a:hover{color:#E0D6C2;}
</style>
<script src="./image-slot.js"></script>
</helmet>
<div style="min-height:100vh;background-color:#171310;background-image:repeating-linear-gradient(0deg, transparent 0 38px, rgba(216,211,196,0.03) 38px 39px), repeating-linear-gradient(90deg, transparent 0 38px, rgba(216,211,196,0.03) 38px 39px);color:#E0D6C2;font-family:'IBM Plex Sans',sans-serif;">

  <div style="display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 40px;border-bottom:1px solid #A2957A;">
    <a href="01 Home.dc.html" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;color:#A2957A;text-decoration:none;">PUBG WAGER</a>
    <div style="display:flex;align-items:center;gap:24px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;color:#A2957A;">AVAILABLE</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:18px;font-variant-numeric:tabular-nums;color:#E0D6C2;">1,240</span>
      </div>
      <a href="05 Profile.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;border:1px solid #A2957A;padding:6px 12px 6px 6px;">
        <span style="width:26px;height:26px;background:#3E7CA3;color:#171310;font-family:'IBM Plex Mono',monospace;font-size:12px;display:flex;align-items:center;justify-content:center;">YR</span>
        <span style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:#E0D6C2;">YouRC</span>
      </a>
    </div>
  </div>

  <div style="display:flex;gap:0;border-bottom:1px solid #A2957A;padding:0 40px;overflow-x:auto;">
    <a href="01 Home.dc.html" style="padding:16px 20px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-decoration:none;color:#A2957A;border-bottom:2px solid transparent;">HOME</a>
    <a href="03 Rooms.dc.html" style="padding:16px 20px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-decoration:none;color:#A2957A;border-bottom:2px solid transparent;">ROOMS</a>
    <a href="04 Room Lobby.dc.html" style="padding:16px 20px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-decoration:none;color:#E0D6C2;border-bottom:2px solid #3E7CA3;">ROOM LOBBY</a>
    <a href="07 Match Result.dc.html" style="padding:16px 20px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-decoration:none;color:#A2957A;border-bottom:2px solid transparent;">MATCH RESULT</a>
    <a href="05 Profile.dc.html" style="padding:16px 20px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-decoration:none;color:#A2957A;border-bottom:2px solid transparent;">PROFILE</a>
  </div>

  <div style="display:grid;grid-template-columns:1fr 380px;gap:0;">
    <div style="position:relative;min-height:520px;overflow:hidden;border-right:1px solid #A2957A;">
      <image-slot id="lobby-map-backdrop" shape="rect" src="assets/lobby-terrain.png" style="width:100%;height:100%;position:absolute;inset:0;opacity:0.6;" placeholder="Drop the match map screenshot"></image-slot>
      <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%, rgba(23,19,16,0.2) 0%, rgba(23,19,16,0.85) 70%);"></div>
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:520px;">
        <div style="width:220px;height:220px;border-radius:50%;background:conic-gradient(#3E7CA3 62%, #A2957A33 0);display:flex;align-items:center;justify-content:center;">
          <div style="width:186px;height:186px;border-radius:50%;background:#171310;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <span style="font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:40px;letter-spacing:1px;">KX-4471</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:16px;color:#3E7CA3;margin-top:4px;">04:12</span>
          </div>
        </div>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:1px;color:#A2957A;margin-top:16px;">SQUAD · ERANGEL · LOCKS IN 04:12</span>
      </div>
    </div>

    <div style="padding:32px;">
      <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:#A2957A;margin-bottom:16px;">Participants — 11/16</div>
      <sc-for list="{{ players }}" as="p" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #221D17;">
          <a href="{{ p.profileUrl }}" style="font-size:14px;text-decoration:none;">{{ p.name }}</a>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A2957A;">{{ p.status }}</span>
        </div>
      </sc-for>

      <div style="height:1px;background:#A2957A;opacity:0.4;margin:24px 0;"></div>

      <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:#A2957A;margin-bottom:12px;">Prize pool</div>
      <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:14px;margin-bottom:6px;"><span style="color:#A2957A;">Entries (11 × 50)</span><span>550</span></div>
      <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:14px;margin-bottom:6px;"><span style="color:#A2957A;">Rake (8%)</span><span>−44</span></div>
      <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:20px;padding-top:10px;border-top:1px solid #A2957A;"><span>Distributed</span><span>506</span></div>

      <button style="margin-top:32px;width:100%;background:transparent;border:1px solid #C13B2A;color:#C13B2A;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;padding:12px;cursor:pointer;">Leave room</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const players = [
      { name: 'ShroudUA', status: 'JOINED', profileUrl: '#' },
      { name: 'Nyx_Sova', status: 'JOINED', profileUrl: '#' },
      { name: 'Ferox.gg', status: 'JOINED', profileUrl: '#' },
      { name: 'Karpiv91', status: 'JOINED', profileUrl: '#' },
      { name: 'QuietRiot', status: 'ESCROWED', profileUrl: '#' },
    ];
    return { players };
  }
}
</script>
</body>
</html>
